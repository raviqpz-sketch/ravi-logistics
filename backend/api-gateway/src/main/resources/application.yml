server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: item-service
          uri: lb://ITEM-SERVICE
          predicates:
            - Path=/api/items/**, /api/customers/**, /api/warehouses/**
        - id: asn-service
          uri: lb://ASN-SERVICE
          predicates:
            - Path=/api/asns/**, /api/receipts/**
        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: wave-service
          uri: lb://WAVE-SERVICE
          predicates:
            - Path=/api/waves/**
        - id: pick-service
          uri: lb://PICK-SERVICE
          predicates:
            - Path=/api/picks/**
        - id: pack-service
          uri: lb://PACK-SERVICE
          predicates:
            - Path=/api/packs/**
        - id: shipment-service
          uri: lb://SHIPMENT-SERVICE
          predicates:
            - Path=/api/shipments/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
