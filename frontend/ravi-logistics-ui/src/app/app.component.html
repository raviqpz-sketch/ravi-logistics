<mat-sidenav-container class="sidenav-container">
  <!-- Sidebar Navigation -->
  <mat-sidenav #sidenav mode="side" [opened]="sidenavOpened" class="sidenav">
    <div class="brand">
      <mat-icon class="brand-icon">local_shipping</mat-icon>
      <div class="brand-text">
        <span class="brand-name">RAVI LOGISTICS</span>
        <span class="brand-tagline">Warehouse Management</span>
      </div>
    </div>

    <div class="customer-badge">
      <mat-icon>business</mat-icon>
      <span>XYZ Modems</span>
    </div>

    <mat-nav-list>
      <mat-list-item
        *ngFor="let item of navItems"
        (click)="navigate(item.route)"
        [class.active]="isActive(item.route)"
        class="nav-item">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </mat-list-item>
    </mat-nav-list>

    <div class="sidenav-footer">
      <small>RAVI LOGISTICS v1.0</small>
    </div>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="main-content">
    <!-- Top Toolbar -->
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()" matTooltip="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">RAVI LOGISTICS</span>
      <span class="spacer"></span>
      <button mat-icon-button matTooltip="Notifications">
        <mat-icon [matBadge]="3" matBadgeColor="warn">notifications</mat-icon>
      </button>
      <button mat-icon-button matTooltip="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <!-- Routed Content -->
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
